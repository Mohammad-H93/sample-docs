site_name: sample_docs
site_description: General team documentation template
site_url: https://example.com/sample_docs/

nav:
  - Home: index.md
  - Getting Started: sessions.md
  - Integrations:
      - Integration Overview: Integrate Sessions with CAD Software/index.md
      - Tool A:
          - Connect Tool A: Integrate Sessions with CAD Software/tool_a/index.md
          - Sync: Integrate Sessions with CAD Software/tool_a/sync-index.md
          - Generate: Integrate Sessions with CAD Software/tool_a/generate-index.md

  - Export:
      - Export Overview: export/index.md
      - PDF Export: export/dwg-index.md
  - Frequently Asked Questions: frequent-questions.md

theme:
  font:
    text: Inter
    code: JetBrains Mono
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: green
      accent: deep purple

    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: blue
      accent: deep orange

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables

extra_css:
  - stylesheets/extra.css

plugins:
  - search

copyright: Copyright &copy; 2026 Mohammad Tabari